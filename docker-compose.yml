services:
  mysql:
    image: mysql:8.0
    container_name: ey-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eyplaywright
      MYSQL_USER: eyuser
      MYSQL_PASSWORD: eypass
    ports:
      - "3306:3306"
    volumes:
      - ey-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ey-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: eyuser
      PMA_PASSWORD: eypass
    ports:
      - "8080:80"

volumes:
  ey-mysql-data:
