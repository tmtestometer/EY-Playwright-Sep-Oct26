<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- merv-tutor-page-v14 -->
<title>Merv-Tutor — step debugger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1218;--panel:#171b24;--border:#2a3140;--text:#e8ecf4;--muted:#8b93a7;--merv:#e2433a;--line:#2d6cdf;--line-bg:rgba(45,108,223,.15)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#1a0a0a,#171b24 45%);flex-shrink:0}
.top h1{margin:0;font-size:1.1rem;font-weight:700}
.top h1 span{color:var(--merv)}
.top .sub{font-size:13px;color:var(--muted);margin-left:8px}
.top a{margin-left:auto;font-size:13px;color:#9ec1ff}
.stats{display:flex;flex-wrap:wrap;gap:10px 18px;padding:8px 20px;border-bottom:1px solid var(--border);background:#12151c;font-size:13px;color:var(--muted);flex-shrink:0}
.stats[hidden]{display:none}
.stats strong{color:var(--text);font-weight:600}
.stats .stat-sep{opacity:.35}
.controls{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.controls button{background:#222836;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;font-weight:500}
.controls button:hover{background:#2a3140}
.controls button:disabled{opacity:.45;cursor:not-allowed}
.controls .pos{font-size:13px;color:var(--muted);min-width:140px;text-align:center}
.controls .cur-line{font-size:13px;font-weight:600;color:#7eb6ff;padding:6px 12px;border-radius:8px;background:#1a2438;border:1px solid #2d6cdf}
.controls .label{font-size:13px;color:var(--text);max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workspace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.workspace.has-files{grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1100px){
  .workspace.has-files{grid-template-columns:160px minmax(0,1fr) minmax(0,1fr)}
}
@media(max-width:900px){
  .workspace,.workspace.has-files{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}
  .files-pane{max-height:140px;border-right:none;border-bottom:1px solid var(--border)}
}
.files-pane{display:none;flex-direction:column;border-right:1px solid var(--border);min-height:0;background:#12151c}
.workspace.has-files .files-pane{display:flex}
.files-list{flex:1;overflow:auto;padding:6px 4px}
.tree-row{display:flex;align-items:center;gap:4px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);padding:4px 6px;margin:1px 0;font:inherit;cursor:pointer;min-height:26px}
.tree-row:hover{background:#1a2030}
.tree-row.active{background:rgba(45,108,223,.18);border-color:#2d6cdf}
.tree-row.step-file{box-shadow:inset 3px 0 0 var(--merv)}
.tree-row .twist{width:14px;flex-shrink:0;text-align:center;color:#8b93a7;font-size:10px;line-height:1}
.tree-row .twist.empty{visibility:hidden}
.tree-row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.tree-row.folder .label{font-weight:600;color:#d7dce8}
.tree-children{display:none}
.tree-children.open{display:block}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0}
.pane:last-child{border-right:none}
.pane-h{padding:8px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:#12151c}
.code-wrap{flex:1;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.55}
.code-line{display:flex;gap:0;min-height:1.55em;padding:0 8px 0 0}
.code-line .ptr{width:1.6em;text-align:center;color:transparent;user-select:none;flex-shrink:0;font-size:12px;font-weight:700}
.code-line .ln{width:3.2em;text-align:right;padding-right:10px;color:#5c6370;user-select:none;flex-shrink:0}
.code-line .tx{flex:1;white-space:pre-wrap;word-break:break-word;padding-right:12px}
.code-line.active{background:var(--line-bg);box-shadow:inset 4px 0 0 var(--line)}
.code-line.active .ptr{color:#fff;background:var(--line);border-radius:4px;margin:1px 0}
.code-line.active .ln{color:var(--line);font-weight:700}
[data-syn="kw"]{color:#c792ea;font-weight:500}
[data-syn="str"]{color:#c3e88d}
[data-syn="num"]{color:#f78c6c}
[data-syn="global"]{color:#82aaff}
[data-syn="prop"]{color:#ffcb6b}
[data-syn="br"]{color:#a6accd}
.code-line.active [data-syn="kw"]{color:#e0b3ff}
.code-line.active [data-syn="str"]{color:#d4f5a0}
tr.var-row td{border-left:3px solid transparent}
tr.var-row.scope-0 td{background:rgba(130,175,255,.06)}
tr.var-row.scope-0 td.name{color:#82aaff}
tr.var-row.scope-0 td.scope{color:#9ec1ff}
tr.var-row.scope-1 td{background:rgba(76,175,80,.08);border-left-color:#4caf50}
tr.var-row.scope-1 td.name{color:#81c784}
tr.var-row.scope-1 td.scope{color:#a5d6a7}
tr.var-row.scope-2 td{background:rgba(171,71,188,.08);border-left-color:#ab47bc}
tr.var-row.scope-2 td.name{color:#ce93d8}
tr.var-row.scope-2 td.scope{color:#e1bee7}
tr.var-row.scope-3 td{background:rgba(255,152,0,.08);border-left-color:#ff9800}
tr.var-row.scope-3 td.name{color:#ffcc80}
tr.var-row.scope-3 td.scope{color:#ffe0b2}
tr.var-row.scope-4 td{background:rgba(0,188,212,.08);border-left-color:#00bcd4}
tr.var-row.scope-4 td.name{color:#80deea}
tr.var-row.scope-4 td.scope{color:#b2ebf2}
tr.var-row.scope-5 td{background:rgba(244,67,54,.08);border-left-color:#ef5350}
tr.var-row.scope-5 td.name{color:#ef9a9a}
tr.var-row.scope-5 td.scope{color:#ffcdd2}
.pane-right-inner{display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(140px,1fr);flex:1;min-height:0}
.pane-right-inner .table-wrap{overflow:auto;min-height:0}
.console-split{display:grid;grid-template-columns:60% 40%;min-height:140px;overflow:hidden;border-top:1px solid var(--border)}
@media(max-width:900px){.console-split{grid-template-columns:1fr}}
.console-wrap{overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.45;padding:10px 12px;background:#0c0e14;min-width:0}
.run-info{overflow:auto;padding:10px 12px;background:#12151c;border-left:1px solid var(--border);min-width:0}
.run-info .ri-file{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-info .ri-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(42,49,64,.6)}
.run-info .ri-row:last-of-type{border-bottom:none}
.run-info .ri-k{font-size:12px;color:var(--muted)}
.run-info .ri-v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--text)}
.run-info .ri-v.big{font-size:15px;color:#82aaff}
.run-info .ri-note{margin-top:8px;font-size:10.5px;line-height:1.4;color:#6f778b}
.console-out{margin:0;white-space:pre-wrap;word-break:break-word}
.console-out.new{color:#b8e986}
.console-empty{padding:16px;color:var(--muted);font-family:Roboto,sans-serif;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:#12151c;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
td.name{font-family:'IBM Plex Mono',monospace;color:#9ec1ff}
td.scope{font-size:12px;color:var(--muted)}
td.val{font-family:'IBM Plex Mono',monospace}
.empty{padding:24px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header class="top">
  <h1>Merv<span>-Tutor</span></h1>
  <span class="sub" id="file-label">Step debugger</span>
  <a href="index.html">← Dashboard</a>
</header>
<div class="stats" id="stats-bar" hidden>
  <span><strong id="stat-steps">0</strong> total steps</span>
  <span class="stat-sep">·</span>
  <span><strong id="stat-iters">0</strong> loop iterations</span>
  <span class="stat-sep">·</span>
  <span><strong id="stat-files">0</strong> files executed</span>
</div>
<div class="controls">
  <button type="button" id="btn-first" title="First step">⏮ First</button>
  <button type="button" id="btn-prev" title="Previous step">◀ Prev</button>
  <span class="pos" id="step-pos">—</span>
  <span class="cur-line" id="current-line" title="Current source line">Line —</span>
  <button type="button" id="btn-next" title="Next step">Next ▶</button>
  <button type="button" id="btn-last" title="Last step">Last ⏭</button>
  <span class="label" id="step-label"></span>
</div>
<div class="workspace" id="workspace">
  <aside class="files-pane" aria-label="Executed files">
    <div class="pane-h">Project Files</div>
    <div class="files-list" id="files-list"></div>
  </aside>
  <section class="pane" aria-label="Source code">
    <div class="pane-h" id="source-pane-h">Source</div>
    <div class="code-wrap" id="code-panel"></div>
  </section>
  <section class="pane" aria-label="Variables and console">
    <div class="pane-right-inner">
      <div class="pane-h">Variables in memory</div>
      <div class="table-wrap" id="vars-panel"></div>
      <div class="pane-h">Console output</div>
      <div class="console-split">
        <div class="console-wrap" id="console-panel"></div>
        <aside class="run-info" id="run-info" aria-label="Run analysis"></aside>
      </div>
    </div>
  </section>
</div>
<script>
(function(){
  var TRACE_URL='merv-tutor/latest.json';
  var state={trace:null,stepIdx:-1,codeRows:[],viewFileId:null,folderOpen:{}};

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  var JS_KW_RE=/\b(break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|function|if|import|in|instanceof|let|new|return|super|switch|this|throw|try|typeof|var|void|while|with|yield|await|async)\b/g;
  var SYN_SPAN_SPLIT=/(<span data-syn="[^"]+">[^<]*<\/span>)/;
  function highlightOutsideSynSpans(html,re,replacer){
    var parts=String(html).split(SYN_SPAN_SPLIT);
    var r=new RegExp(re.source,re.flags);
    for(var i=0;i<parts.length;i++){
      if(parts[i].charAt(0)==='<'&&parts[i].indexOf('<span data-syn=')===0)continue;
      parts[i]=parts[i].replace(r,replacer);
    }
    return parts.join('');
  }
  function synSpan(kind,inner){return '<span data-syn="'+kind+'">'+inner+'</span>';}
  function highlightJs(code){
    var s=esc(code);
    s=s.replace(/('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")/g,function(m){return synSpan('str',m);});
    s=s.replace(/\b(0x[\da-fA-F]+|\d+\.?\d*)\b/g,function(m){return synSpan('num',m);});
    s=highlightOutsideSynSpans(s,JS_KW_RE,function(m){return synSpan('kw',m);});
    s=highlightOutsideSynSpans(s,/\b(console)\b/g,function(m){return synSpan('global',m);});
    s=highlightOutsideSynSpans(s,/(\.)([a-zA-Z_$][\w$]*)/g,function(_m,dot,name){return dot+synSpan('prop',name);});
    s=highlightOutsideSynSpans(s,/([{}()[\],])/g,function(_m,ch){return synSpan('br',ch);});
    return s;
  }

  function scopeRowClass(storageKey){
    var at=storageKey.lastIndexOf('@');
    if(at<=0)return 'scope-0';
    var line=parseInt(storageKey.slice(at+1),10);
    if(!line||isNaN(line))return 'scope-1';
    return 'scope-'+((line%5)+1);
  }
  function typeOf(v){
    if(v===null)return 'null';
    if(Array.isArray(v))return 'array';
    if(typeof v==='object'&&v.__type)return String(v.__type);
    return typeof v;
  }
  function fmtVal(v){
    if(v===undefined)return 'undefined';
    try{return JSON.stringify(v);}catch(_e){return String(v);}
  }

  function normalizeTrace(data){
    var files=data.files&&data.files.length?data.files:[{
      id:'0',
      name:data.sourceFile||'script.js',
      sourceText:data.sourceText||'',
      sourceLines:data.sourceLines||String(data.sourceText||'').split(/\r?\n/),
      codeLines:data.codeLines||null,
      executedAt:data.updatedAt||''
    }];
    var steps=(data.steps||[]).map(function(s,i){
      return Object.assign({},s,{
        index:typeof s.index==='number'?s.index:i,
        fileId:s.fileId||files[0].id
      });
    });
    var stats=data.stats||computeStats(files,steps);
    return {
      version:data.version||1,
      sourceFile:data.sourceFile||files[0].name,
      files:files,
      steps:steps,
      stats:stats
    };
  }

  function computeStats(files,steps){
    var by= {};
    files.forEach(function(f){by[f.id]={fileId:f.id,name:f.name,steps:0,iterations:0};});
    var totalIterations=0;
    steps.forEach(function(s){
      var id=s.fileId||files[0].id;
      if(!by[id])by[id]={fileId:id,name:id,steps:0,iterations:0};
      by[id].steps+=1;
      if(s.kind==='msg'&&/loop body/i.test(s.label||'')){
        by[id].iterations+=1;
        totalIterations+=1;
      }
    });
    var byFile=Object.keys(by).map(function(k){return by[k];}).filter(function(r){return r.steps>0;});
    return {totalSteps:steps.length,totalIterations:totalIterations,filesExecuted:byFile.length,byFile:byFile};
  }

  function buildCodeRowsFromFile(file){
    if(file.codeLines&&file.codeLines.length)return file.codeLines.map(function(row){
      return {sourceLine:row.sourceLine,text:row.text};
    });
    var lines=file.sourceLines||String(file.sourceText||'').split(/\r?\n/);
    var out=[];
    var inBlock=false;
    for(var i=0;i<lines.length;i++){
      var text=lines[i];
      var trimmed=String(text).trim();
      if(inBlock){
        if(trimmed.indexOf('*/')>=0)inBlock=false;
        continue;
      }
      if(!trimmed)continue;
      if(trimmed.indexOf('//')===0)continue;
      if(trimmed.indexOf('/*')===0){
        var end=trimmed.indexOf('*/',2);
        if(end<0){inBlock=true;continue;}
        if(!trimmed.slice(end+2).trim())continue;
      }
      out.push({sourceLine:i+1,text:text});
    }
    return out;
  }

  function fileById(id){
    if(!state.trace)return null;
    for(var i=0;i<state.trace.files.length;i++){
      if(state.trace.files[i].id===id)return state.trace.files[i];
    }
    return state.trace.files[0]||null;
  }

  function currentStep(){
    if(state.stepIdx<0||!state.trace||!state.trace.steps.length)return null;
    return state.trace.steps[state.stepIdx];
  }

  function selectedStepIndices(){
    if(!state.trace||!state.viewFileId)return [];
    var out=[];
    for(var i=0;i<state.trace.steps.length;i++){
      if((state.trace.steps[i].fileId||state.trace.files[0].id)===state.viewFileId)out.push(i);
    }
    return out;
  }

  function currentSourceLine(){
    var st=currentStep();
    if(!st)return 0;
    if(st.line>0)return st.line;
    var line=0;
    for(var i=0;i<=state.stepIdx;i++){
      var L=state.trace.steps[i].line|0;
      if(L>0&&(state.trace.steps[i].fileId||'0')===(st.fileId||'0'))line=L;
    }
    return line;
  }

  function loadCodeForViewFile(){
    var f=fileById(state.viewFileId);
    state.codeRows=f?buildCodeRowsFromFile(f):[];
    var h=document.getElementById('source-pane-h');
    if(h)h.textContent=f?('Source — '+f.name):'Source';
  }

  function buildFileTree(files){
    var root={name:'',path:'',folders:{},files:[]};
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var parts=String(f.name||f.id).split('/').filter(Boolean);
      if(!parts.length)continue;
      var node=root;
      for(var p=0;p<parts.length-1;p++){
        var seg=parts[p];
        var folderPath=node.path?(node.path+'/'+seg):seg;
        if(!node.folders[seg])node.folders[seg]={name:seg,path:folderPath,folders:{},files:[]};
        node=node.folders[seg];
      }
      node.files.push({
        id:f.id,
        name:parts[parts.length-1],
        full:f.name||f.id
      });
    }
    return root;
  }

  function ensureFolderOpenForView(){
    if(!state.viewFileId)return;
    var parts=String(state.viewFileId).split('/');
    var path='';
    for(var i=0;i<parts.length-1;i++){
      path+=(i?'/':'')+parts[i];
      state.folderOpen[path]=true;
    }
  }

  function isFolderOpen(folderPath){
    if(state.folderOpen[folderPath]==null)return true;
    return !!state.folderOpen[folderPath];
  }

  function renderTreeNode(node,depth,statsBy){
    var html='';
    var folderNames=Object.keys(node.folders).sort();
    for(var i=0;i<folderNames.length;i++){
      var folder=node.folders[folderNames[i]];
      var open=isFolderOpen(folder.path);
      html+='<button type="button" class="tree-row folder" data-folder="'+esc(folder.path)+'" style="padding-left:'+(6+depth*14)+'px" title="'+esc(folder.path)+'" aria-expanded="'+(open?'true':'false')+'">'+
        '<span class="twist">'+(open?'▾':'▸')+'</span>'+
        '<span class="label">'+esc(folder.name)+'</span>'+
        '</button>';
      html+='<div class="tree-children'+(open?' open':'')+'" data-folder-children="'+esc(folder.path)+'">'+
        renderTreeNode(folder,depth+1,statsBy)+
        '</div>';
    }
    var files=node.files.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
    for(var j=0;j<files.length;j++){
      var f=files[j];
      var meta=statsBy[f.id]||{steps:0,iterations:0};
      var cls='tree-row file';
      if(f.id===state.viewFileId)cls+=' active';
      var step=currentStep();
      if(step&&(step.fileId||'0')===f.id)cls+=' step-file';
      html+='<button type="button" class="'+cls+'" data-file-id="'+esc(f.id)+'" style="padding-left:'+(6+depth*14)+'px" title="'+
        esc(f.full)+' · '+meta.steps+' steps · '+meta.iterations+' loop iterations">'+
        '<span class="twist empty">▸</span>'+
        '<span class="label">'+esc(f.name)+'</span>'+
        '</button>';
    }
    return html;
  }

  function renderFiles(){
    var list=document.getElementById('files-list');
    var workspace=document.getElementById('workspace');
    if(!state.trace||!state.trace.files.length){
      workspace.classList.remove('has-files');
      list.innerHTML='';
      return;
    }
    workspace.classList.add('has-files');
    var statsBy={};
    (state.trace.stats.byFile||[]).forEach(function(r){statsBy[r.fileId]=r;});
    var tree=buildFileTree(state.trace.files);
    list.innerHTML=renderTreeNode(tree,0,statsBy);

    list.querySelectorAll('.tree-row.folder').forEach(function(btn){
      btn.addEventListener('click',function(){
        var folderPath=btn.getAttribute('data-folder');
        state.folderOpen[folderPath]=!isFolderOpen(folderPath);
        renderFiles();
      });
    });
    list.querySelectorAll('.tree-row.file').forEach(function(btn){
      btn.addEventListener('click',function(){
        state.viewFileId=btn.getAttribute('data-file-id');
        ensureFolderOpenForView();
        loadCodeForViewFile();
        renderRunInfo();
        var indices=selectedStepIndices();
        goTo(indices.length?indices[0]:-1);
      });
    });
  }

  function renderStats(){
    var bar=document.getElementById('stats-bar');
    if(!state.trace||!state.trace.stats){bar.hidden=true;return;}
    var s=state.trace.stats;
    bar.hidden=false;
    document.getElementById('stat-steps').textContent=String(s.totalSteps||0);
    document.getElementById('stat-iters').textContent=String(s.totalIterations||0);
    document.getElementById('stat-files').textContent=String(s.filesExecuted||state.trace.files.length||0);
  }

  function renderCode(){
    var el=document.getElementById('code-panel');
    if(!state.codeRows.length){el.innerHTML='<div class="empty">No source</div>';return;}
    var step=currentStep();
    var stepFileId=step?(step.fileId||'0'):null;
    var showHighlight=stepFileId&&stepFileId===state.viewFileId;
    var cur=showHighlight?currentSourceLine():0;
    var curEl=document.getElementById('current-line');
    if(curEl){
      if(showHighlight&&cur>0)curEl.textContent='Line '+cur;
      else if(step&&stepFileId!==state.viewFileId)curEl.textContent='Other file';
      else curEl.textContent='Line —';
    }
    var html='';
    for(var i=0;i<state.codeRows.length;i++){
      var row=state.codeRows[i];
      var active=cur>0&&row.sourceLine===cur;
      var cls=active?'code-line active':'code-line';
      var ptr=active?'\u25B6':'\u00A0';
      html+='<div class="'+cls+'" data-source-line="'+row.sourceLine+'"><span class="ptr" aria-hidden="true">'+ptr+'</span><span class="ln">'+row.sourceLine+'</span><span class="tx">'+highlightJs(row.text)+'</span></div>';
    }
    el.innerHTML=html;
    var activeNode=el.querySelector('.code-line.active');
    if(activeNode)activeNode.scrollIntoView({block:'center',behavior:'smooth'});
  }

  function parseVarKey(key){
    var at=key.lastIndexOf('@');
    if(at<=0)return {name:key,scope:'global'};
    return {name:key.slice(0,at),scope:'line '+key.slice(at+1)};
  }

  function renderVars(){
    var el=document.getElementById('vars-panel');
    var step=currentStep();
    if(!step){
      el.innerHTML='<div class="empty">Run <code>npx merv-tutor yourfile.js</code>, then <code>npx merv-tutor open</code>.</div>';
      return;
    }
    var vars=step.vars||{};
    var keys=Object.keys(vars).sort();
    if(!keys.length){
      el.innerHTML='<div class="empty">No variables tracked yet at this step.</div>';
      return;
    }
    var rows='';
    for(var k=0;k<keys.length;k++){
      var storageKey=keys[k];
      var meta=parseVarKey(storageKey);
      var val=vars[storageKey];
      rows+='<tr class="var-row '+scopeRowClass(storageKey)+'"><td class="name">'+esc(meta.name)+'</td><td class="scope">'+esc(meta.scope)+'</td><td class="val">'+esc(fmtVal(val))+'</td><td>'+esc(typeOf(val))+'</td></tr>';
    }
    el.innerHTML='<table><thead><tr><th>Name</th><th>Scope</th><th>Value</th><th>Type</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  function renderConsole(){
    var el=document.getElementById('console-panel');
    var step=currentStep();
    if(!step){
      el.innerHTML='<div class="console-empty">Console output appears here as you step through.</div>';
      return;
    }
    var lines=step.consoleLines;
    if(!lines||!lines.length){
      if(step.kind==='console'&&step.label){
        var t=String(step.label).replace(/^console\.\w+:\s*/,'');
        el.innerHTML='<pre class="console-out new">'+esc(t)+'</pre>';
        return;
      }
      el.innerHTML='<div class="console-empty">No console output yet at this step.</div>';
      return;
    }
    var prev=state.stepIdx>0&&state.trace.steps[state.stepIdx-1].consoleLines?
      state.trace.steps[state.stepIdx-1].consoleLines:[];
    var prevText=prev.length?prev.join('\n'):'';
    var allText=lines.join('\n');
    if(!prevText){
      el.innerHTML='<pre class="console-out">'+esc(allText)+'</pre>';
      return;
    }
    var newText=lines.slice(prev.length).join('\n');
    if(!newText){
      el.innerHTML='<pre class="console-out">'+esc(allText)+'</pre>';
      return;
    }
    el.innerHTML='<pre class="console-out">'+esc(prevText)+'</pre><pre class="console-out new">'+esc(newText)+'</pre>';
    var last=el.lastElementChild;
    if(last)last.scrollIntoView({block:'nearest',behavior:'smooth'});
  }

  function renderRunInfo(){
    var el=document.getElementById('run-info');
    if(!el)return;
    if(!state.trace||!state.trace.files.length){
      el.innerHTML='<div class="ri-note">Run a file to see its step, loop, and complexity analysis.</div>';
      return;
    }
    var file=fileById(state.viewFileId)||state.trace.files[0];
    var stats={steps:0,iterations:0};
    (state.trace.stats&&state.trace.stats.byFile||[]).forEach(function(r){
      if(r.fileId===file.id)stats=r;
    });
    var cx=file.complexity||{};
    var time=cx.time||'n/a';
    var space=cx.space||'n/a';
    var depth=typeof cx.maxLoopDepth==='number'?cx.maxLoopDepth:null;
    var html='<div class="ri-file" title="'+esc(file.name||file.id)+'">'+esc(file.name||file.id)+'</div>'+
      '<div class="ri-row"><span class="ri-k">Steps</span><span class="ri-v">'+stats.steps+'</span></div>'+
      '<div class="ri-row"><span class="ri-k">Loop iterations</span><span class="ri-v">'+stats.iterations+'</span></div>'+
      '<div class="ri-row"><span class="ri-k">Time complexity</span><span class="ri-v big">'+esc(time)+'</span></div>'+
      '<div class="ri-row"><span class="ri-k">Space complexity</span><span class="ri-v big">'+esc(space)+'</span></div>';
    if(depth!==null){
      html+='<div class="ri-row"><span class="ri-k">Max loop nesting</span><span class="ri-v">'+depth+'</span></div>';
    }
    if(cx.recursive){
      html+='<div class="ri-row"><span class="ri-k">Recursion</span><span class="ri-v">yes</span></div>';
    }
    html+='<div class="ri-note">Complexity is estimated from loop nesting and collection growth in the source. '+
      'Loops reached through helper functions are counted where they are written.</div>';
    el.innerHTML=html;
  }

  function renderControls(){
    var indices=selectedStepIndices();
    var n=indices.length;
    var localIdx=indices.indexOf(state.stepIdx);
    var pos=document.getElementById('step-pos');
    var lab=document.getElementById('step-label');
    var first=document.getElementById('btn-first');
    var prev=document.getElementById('btn-prev');
    var next=document.getElementById('btn-next');
    var last=document.getElementById('btn-last');
    if(!n||localIdx<0){
      pos.textContent='No steps';
      lab.textContent='';
      first.disabled=prev.disabled=next.disabled=last.disabled=true;
      return;
    }
    pos.textContent='Step '+(localIdx+1)+' of '+n;
    var st=state.trace.steps[state.stepIdx];
    var file=fileById(st.fileId||'0');
    var fileBit=file&&state.trace.files.length>1?('['+file.name+'] '):'';
    lab.textContent=fileBit+(st.kind?st.kind+': ':'')+(st.label||'');
    first.disabled=prev.disabled=localIdx<=0;
    next.disabled=last.disabled=localIdx>=n-1;
  }

  function goTo(idx){
    if(!state.trace||!state.trace.steps.length||idx<0)return;
    var max=state.trace.steps.length-1;
    state.stepIdx=Math.max(0,Math.min(max,idx));
    renderFiles();
    renderCode();
    renderVars();
    renderConsole();
    renderRunInfo();
    renderControls();
  }

  function moveWithinFile(delta){
    var indices=selectedStepIndices();
    if(!indices.length)return;
    var localIdx=indices.indexOf(state.stepIdx);
    if(localIdx<0)localIdx=0;
    localIdx=Math.max(0,Math.min(indices.length-1,localIdx+delta));
    goTo(indices[localIdx]);
  }

  function goToFileBoundary(last){
    var indices=selectedStepIndices();
    if(indices.length)goTo(last?indices[indices.length-1]:indices[0]);
  }

  function loadTrace(){
    fetch(TRACE_URL,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(data){
      state.trace=normalizeTrace(data);
      var newest=state.trace.files[0]||null;
      for(var i=1;i<state.trace.files.length;i++){
        if(String(state.trace.files[i].executedAt||'')>=String(newest&&newest.executedAt||''))newest=state.trace.files[i];
      }
      state.viewFileId=newest?newest.id:null;
      ensureFolderOpenForView();
      var initialIndices=selectedStepIndices();
      state.stepIdx=initialIndices.length?initialIndices[0]:-1;
      document.getElementById('file-label').textContent=
        state.trace.files.length>1
          ? (state.trace.files.length+' files')
          : (state.trace.sourceFile||'Tutor trace');
      loadCodeForViewFile();
      renderStats();
      renderFiles();
      renderCode();
      renderVars();
      renderConsole();
      renderRunInfo();
      renderControls();
    }).catch(function(e){
      document.getElementById('file-label').textContent='No trace loaded';
      document.getElementById('code-panel').innerHTML=
        '<div class="empty"><strong>No tutor trace in this report folder.</strong><br><br>'+
        'Expected <code>merv-tutor/latest.json</code> next to this page.<br><br>'+
        'Run a file first, then open the debugger <em>from the same folder</em>:<br>'+
        '<code>npx merv-tutor test.js</code><br><code>npx merv-tutor open</code><br><br>'+
        'Or point at the folder that has the trace:<br>'+
        '<code>npx merv-tutor open ./merv-reports</code>'+
        '<br><br><span style="opacity:.6">'+esc(String(e&&e.message||e))+'</span></div>';
      document.getElementById('vars-panel').innerHTML='<div class="empty">No variables.</div>';
      document.getElementById('console-panel').innerHTML='<div class="console-empty">No console output.</div>';
      renderRunInfo();
      document.getElementById('stats-bar').hidden=true;
    });
  }

  document.getElementById('btn-first').addEventListener('click',function(){goToFileBoundary(false);});
  document.getElementById('btn-prev').addEventListener('click',function(){moveWithinFile(-1);});
  document.getElementById('btn-next').addEventListener('click',function(){moveWithinFile(1);});
  document.getElementById('btn-last').addEventListener('click',function(){goToFileBoundary(true);});
  document.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowRight'||ev.key==='PageDown'){ev.preventDefault();moveWithinFile(1);}
    if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();moveWithinFile(-1);}
    if(ev.key==='Home'){ev.preventDefault();goToFileBoundary(false);}
    if(ev.key==='End'){ev.preventDefault();goToFileBoundary(true);}
  });

  loadTrace();
})();
</script>
</body>
</html>
