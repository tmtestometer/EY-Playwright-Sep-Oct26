<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.MERV_REPORTS_DELETE_API="__MERV_REPORTS_DELETE_API__";</script>
<script>window.MERV_REPORT_FOLDERS=__MERV_REPORT_FOLDERS__;</script>
<title>Merv — Test Suites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--merv-red:#e2433a;--merv-grad:linear-gradient(135deg,#e90101,#c20000);--sidebar:#f2f3f5;--border:#e6e8ec;--text:#1a1a1a;--muted:#5c5f66;}
*{box-sizing:border-box;}html{font-family:'Roboto',system-ui,-apple-system,sans-serif;}body{margin:0;font-family:'Roboto',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);min-height:100vh;}button,input,select,textarea{font-family:inherit;}
h1,h2,h3,h4,h5,h6{letter-spacing:0.5px;}
.dash{display:flex;min-height:100vh;}
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);padding:20px 0 0;flex-shrink:0;position:sticky;top:0;align-self:flex-start;min-height:100vh;display:flex;flex-direction:column;}
.sidebar-brand{text-align:center;padding:0 16px 12px;border-bottom:1px solid var(--border);margin-bottom:0;}
.sidebar-brand img{max-width:140px;height:auto;display:block;margin:0 auto;}
.sidebar-local-label{text-align:center;margin:0;padding:12px 16px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--merv-red);letter-spacing:.04em;}
.nav{margin:8px 0;padding:0 12px;flex:1;min-height:0;}
.sidebar-footer{margin-top:auto;padding:18px 14px 22px;border-top:1px solid var(--border);text-align:center;}
.sidebar-footer a.sidebar-merv-online{display:block;font-size:13px;font-weight:600;color:#0d6efd;text-decoration:none;margin-bottom:14px;}
.sidebar-footer a.sidebar-merv-online:hover{text-decoration:underline;}
.sidebar-powered{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;}
.sidebar-footer a.sidebar-techelliptica{display:inline-block;line-height:0;}
.sidebar-footer a.sidebar-techelliptica img{max-width:150px;height:auto;display:block;margin:0 auto;}
.nav a{letter-spacing:0.5px;display:block;padding:12px 14px;border-radius:8px;color:#4a4a4a;text-decoration:none;font-size:14px;font-weight:500;margin:2px 0;}
.nav a:hover{background:rgba(0,0,0,.04);}
.nav a.active{background:#fdeaea;color:var(--merv-red);font-weight:600;border-left:3px solid var(--merv-red);padding-left:11px;}
.nav-section{margin:14px 0 10px;padding-top:12px;border-top:1px solid var(--border);}
.nav-section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#868e96;margin:0 0 8px;padding:0 4px;}
.nav-sub-link{font-size:13px!important;font-weight:500!important;padding:8px 12px 8px 14px!important;margin:2px 0!important;border-left:3px solid transparent!important;}
.nav-sub-link:hover{background:rgba(0,0,0,.03)!important;}
.nav-sub-link.active{background:#fdeaea!important;color:var(--merv-red)!important;font-weight:600!important;border-left-color:var(--merv-red)!important;padding-left:11px!important;}
[id^="kpi-"],[id^="cons-subpanel"]{scroll-margin-top:20px;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fafbfc;}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--border);}
.search-wrap{flex:1;min-width:200px;max-width:420px;}
#suite-search{width:100%;padding:11px 16px;border:1px solid #ddd;border-radius:10px;font-size:14px;}
#suite-search:focus{outline:2px solid rgba(226,67,54,.2);border-color:var(--merv-red);}
.content{padding:24px 28px 48px;}
.content-view{display:none;}
.content-view.active{display:block;}
.content h2{margin:0 0 18px 0;font-size:1.1rem;font-weight:700;color:#333;}
.suite-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;}
.suite-card{background:#fff;border:1px solid #e8eaed;border-radius:12px;padding:20px 20px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;}
.suite-card.is-latest{box-shadow:0 4px 20px rgba(226,67,54,.12);border-color:rgba(226,67,54,.25);}
.suite-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.suite-title-block{flex:1;min-width:0;}
.suite-top .suite-name{margin:0;font-size:1.05rem;font-weight:700;line-height:1.3;word-break:break-word;}
.suite-top .suite-folder{margin:6px 0 0;font-size:12px;color:var(--muted);font-weight:500;line-height:1.35;word-break:break-word;}
.status-badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:4px;color:#fff;text-transform:uppercase;white-space:nowrap;}
.status-badge.done{background:#28a745;}
.status-badge.run{background:#ffc107;color:#212529;}
@keyframes idx-blink-inprogress{0%,100%{opacity:1;}50%{opacity:.32;}}
.status-badge.run{animation:idx-blink-inprogress 1.1s ease-in-out infinite;}
.status-badge.abort{background:#6c757d;color:#fff;animation:none !important;}
.suite-counts{margin:10px 0 0;font-size:13px;color:var(--muted);}
.suite-counts strong{color:#333;font-weight:600;}
.suite-meta{margin:10px 0 0;color:var(--muted);}
.suite-meta-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.suite-meta-dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:0;flex:1;min-width:0;}
.suite-meta-dl dt{margin:0;font-weight:600;color:#6b6b6b;}
.suite-meta-dl dd{margin:0;}
.suite-meta-donut{flex-shrink:0;padding-top:2px;}
.suite-meta .donut{position:relative;width:76px;height:76px;border-radius:50%;flex-shrink:0;}
.suite-meta .donut::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.suite-tags-block{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1f3;}
.suite-tags-label{font-size:10px;font-weight:700;color:#6b6b6b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:22px;}
.tag-pill{background:#eef1f4;color:#495057;padding:3px 10px;border-radius:20px;font-size:11px;}
.suite-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid #f0f1f3;}
.suite-when{font-size:12px;color:var(--muted);line-height:1.4;}
.suite-when .rel{display:block;font-size:11px;margin-top:2px;opacity:.85;}
.suite-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn-view{display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #0d6efd;border-radius:8px;color:#0d6efd;font-size:13px;font-weight:600;text-decoration:none;background:#fff;}
.btn-view:hover{background:#f0f7ff;}
.icon-btn{width:36px;height:36px;border:1px solid #dee2e6;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:#495057;}
.icon-btn:hover{background:#f8f9fa;border-color:#adb5bd;}
.btn-delete{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#c82333;border:1px solid #dc3545;}
.btn-delete:hover{background:#fff5f5;}
.btn-delete:disabled{opacity:.5;cursor:not-allowed;}
.empty{max-width:520px;margin:48px auto;text-align:center;padding:40px;color:var(--muted);}
.chart-panel{background:#fff;border:1px solid #e8eaed;border-radius:14px;padding:20px 22px;margin-bottom:28px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;width:100%;}
.chart-head h2{margin:0;font-size:1.08rem;font-weight:700;color:#1a1a1a;letter-spacing:-.02em;}
.chart-live{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#28a745;}
.chart-canvas-wrap{height:280px;position:relative;max-width:100%;background:#fff;border-radius:8px;}
.chart-note{margin:14px 0 0;font-size:12px;color:#5c5f66;line-height:1.5;}
/* ... rest of CSS + full HTML/JS is kept identical to Java output ... */
</style>
</head>
<body>
__MERV_TEMPLATE_BODY__
</body>
</html>
